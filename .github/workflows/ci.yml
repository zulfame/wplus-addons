name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Coding standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs dealerdirect/phpcodesniffer-composer-installer
          "$(composer global config bin-dir --absolute)/phpcs" --standard=WordPress-Extra,WordPress-Docs --extensions=php --ignore=node_modules,vendor,tests,dist .
      - name: Build zip
        run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wplus-addons
          path: dist/*.zip
